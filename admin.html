<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Admin</title>
<style>
  :root {
    --paper: #FBF9F4;
    --ink: #14201C;
    --pine: #1F5C4F;
    --pine-dark: #163F36;
    --marigold: #C98A1F;
    --card: #FFFFFF;
    --muted: #6B7268;
    --line: rgba(20,32,28,0.14);
    --danger: #B4432F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  h1, .display { font-family: 'Fraunces', Georgia, serif; }
  .mono, .price-input { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  header {
    background: var(--pine);
    color: var(--paper);
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title { font-size: 20px; font-style: italic; font-weight: 600; margin: 0; }
  #logout-btn {
    background: transparent;
    border: 1px solid rgba(251,249,244,0.4);
    color: var(--paper);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    display: none;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(20,32,28,0.10), 0 1px 2px rgba(20,32,28,0.06);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 14px 0 6px;
  }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=password], textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--marigold);
    outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 60px; }
  .file-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  #preview {
    width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
    display: none; background: #EFEAE0; border: 1px solid var(--line);
  }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--pine); color: var(--paper); width: 100%; margin-top: 18px; }
  .btn-primary:hover { background: var(--pine-dark); }
  .btn-primary[disabled] { opacity: 0.6; cursor: default; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 10px; width: 100%; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 30px 0 12px; }
  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(20,32,28,0.06);
  }
  .product-row img, .product-row .ph {
    width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #EFEAE0;
  }
  .product-row .ph { display: flex; align-items: center; justify-content: center; color: var(--pine); font-family: 'Fraunces', serif; font-style: italic; }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 600; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-price { font-size: 13px; color: var(--marigold); margin: 0; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--ink);
  }
  .icon-btn.danger { color: var(--danger); border-color: rgba(180,67,47,0.3); }
  #empty-msg { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; display: none; }

  #login-screen { max-width: 340px; margin: 60px auto 0; padding: 0 16px; }
  #login-screen .card { text-align: left; }
  #login-screen h1 { font-size: 22px; margin: 0 0 4px; }
  #login-screen p.sub { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  #admin-screen { display: none; }
</style>
</head>
<body>
<header>
  <p class="title">Shop Admin</p>
  <button id="logout-btn">Log out</button>
</header>

<div id="login-screen">
  <div class="card">
    <h1 class="display">Sign in</h1>
    <p class="sub">Enter your admin password.</p>
    <form id="login-form">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>
</div>

<main id="admin-screen">
  <div class="card">
    <h1 class="display" id="form-title" style="font-size:20px;margin:0 0 4px;">Add product</h1>
    <form id="product-form">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="price">Price</label>
      <input type="number" id="price" class="price-input" step="0.01" min="0" required>

      <label for="description">Description (optional)</label>
      <textarea id="description"></textarea>

      <label for="image">Photo</label>
      <div class="file-row">
        <img id="preview" alt="Preview">
        <input type="file" id="image" accept="image/*">
      </div>

      <button class="btn btn-primary" type="submit" id="save-btn">Add product</button>
      <button class="btn btn-secondary" type="button" id="cancel-btn" style="display:none;">Cancel edit</button>
      <p class="error-msg" id="form-error"></p>
    </form>
  </div>

  <p class="section-title">Your products</p>
  <div id="product-list"></div>
  <p id="empty-msg">No products yet — add your first one above.</p>
</main>

<script>
  var editingId = null;
  var editingImageUrl = '';

  var loginScreen = document.getElementById('login-screen');
  var adminScreen = document.getElementById('admin-screen');
  var logoutBtn = document.getElementById('logout-btn');
  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var productForm = document.getElementById('product-form');
  var formError = document.getElementById('form-error');
  var formTitle = document.getElementById('form-title');
  var saveBtn = document.getElementById('save-btn');
  var cancelBtn = document.getElementById('cancel-btn');
  var nameInput = document.getElementById('name');
  var priceInput = document.getElementById('price');
  var descInput = document.getElementById('description');
  var imageInput = document.getElementById('image');
  var preview = document.getElementById('preview');
  var productList = document.getElementById('product-list');
  var emptyMsg = document.getElementById('empty-msg');

  function showLogin() {
    loginScreen.style.display = 'block';
    adminScreen.style.display = 'none';
    logoutBtn.style.display = 'none';
  }
  function showAdmin() {
    loginScreen.style.display = 'none';
    adminScreen.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
  }

  function checkSession() {
    fetch('/api/session')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.authenticated) { showAdmin(); loadProducts(); }
        else { showLogin(); }
      })
      .catch(showLogin);
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { loginError.textContent = res.d.error || 'Login failed'; return; }
        document.getElementById('password').value = '';
        showAdmin();
        loadProducts();
      })
      .catch(function () { loginError.textContent = 'Network error. Try again.'; });
  });

  logoutBtn.addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST' }).then(showLogin);
  });

  var pendingImageData = null; // holds a compressed photo as a data URL, ready to save

  function compressImage(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function () { reject(new Error('Could not read that image.')); };
        img.src = e.target.result;
      };
      reader.onerror = function () { reject(new Error('Could not read that file.')); };
      reader.readAsDataURL(file);
    });
  }

  imageInput.addEventListener('change', function () {
    var file = imageInput.files[0];
    if (!file) return;
    formError.textContent = '';
    preview.style.display = 'none';
    compressImage(file, 900, 0.75)
      .then(function (dataUrl) {
        pendingImageData = dataUrl;
        preview.src = dataUrl;
        preview.style.display = 'block';
      })
      .catch(function (err) {
        formError.textContent = err.message;
        imageInput.value = '';
      });
  });

  function resetForm() {
    editingId = null;
    editingImageUrl = '';
    pendingImageData = null;
    productForm.reset();
    preview.style.display = 'none';
    formTitle.textContent = 'Add product';
    saveBtn.textContent = 'Add product';
    cancelBtn.style.display = 'none';
    formError.textContent = '';
  }

  cancelBtn.addEventListener('click', resetForm);

  productForm.addEventListener('submit', function (e) {
    e.preventDefault();
    formError.textContent = '';
    var name = nameInput.value.trim();
    var price = parseFloat(priceInput.value);
    if (!name || isNaN(price) || price < 0) {
      formError.textContent = 'Enter a valid name and price.';
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var imageUrl = pendingImageData || editingImageUrl || '';
    var payload = { name: name, price: price, description: descInput.value.trim(), image_url: imageUrl };
    var url = editingId ? '/api/products?id=' + editingId : '/api/products';
    var method = editingId ? 'PUT' : 'POST';

    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d.error || 'Save failed');
        resetForm();
        loadProducts();
      })
      .catch(function (err) { formError.textContent = err.message; })
      .finally(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = editingId ? 'Update product' : 'Add product';
      });
  });

  function startEdit(product) {
    editingId = product.id;
    editingImageUrl = product.image_url || '';
    nameInput.value = product.name;
    priceInput.value = product.price;
    descInput.value = product.description || '';
    imageInput.value = '';
    if (editingImageUrl) { preview.src = editingImageUrl; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; }
    formTitle.textContent = 'Edit product';
    saveBtn.textContent = 'Update product';
    cancelBtn.style.display = 'block';
    formError.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteProduct(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    fetch('/api/products?id=' + id, { method: 'DELETE' })
      .then(function (r) { if (!r.ok) throw new Error(); loadProducts(); })
      .catch(function () { alert('Delete failed. Please try again.'); });
  }

  function loadProducts() {
    fetch('/api/products')
      .then(function (r) { return r.json(); })
      .then(function (products) {
        productList.innerHTML = '';
        emptyMsg.style.display = products.length ? 'none' : 'block';
        products.forEach(function (product) {
          var row = document.createElement('div');
          row.className = 'product-row';

          if (product.image_url) {
            var img = document.createElement('img');
            img.src = product.image_url;
            img.alt = product.name;
            row.appendChild(img);
          } else {
            var ph = document.createElement('div');
            ph.className = 'ph';
            ph.textContent = (product.name || '?').charAt(0).toUpperCase();
            row.appendChild(ph);
          }

          var info = document.createElement('div');
          info.className = 'row-info';
          var n = document.createElement('p');
          n.className = 'row-name';
          n.textContent = product.name;
          var p = document.createElement('p');
          p.className = 'row-price mono';
          p.textContent = String(product.price);
          info.appendChild(n);
          info.appendChild(p);
          row.appendChild(info);

          var actions = document.createElement('div');
          actions.className = 'row-actions';
          var editBtn = document.createElement('button');
          editBtn.className = 'icon-btn';
          editBtn.type = 'button';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', function () { startEdit(product); });
          var delBtn = document.createElement('button');
          delBtn.className = 'icon-btn danger';
          delBtn.type = 'button';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', function () { deleteProduct(product.id); });
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          row.appendChild(actions);

          productList.appendChild(row);
        });
      })
      .catch(function () {
        productList.innerHTML = '';
        emptyMsg.textContent = "Couldn't load products. Please refresh.";
        emptyMsg.style.display = 'block';
      });
  }

  checkSession();
</script>
</body>
</html>
