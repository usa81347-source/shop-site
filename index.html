<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop</title>
<style>
  @font-face-fallback { }
  :root {
    --paper: #FBF9F4;
    --ink: #14201C;
    --pine: #1F5C4F;
    --pine-dark: #163F36;
    --marigold: #C98A1F;
    --card: #FFFFFF;
    --muted: #6B7268;
    --line: rgba(20,32,28,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  h1, h2, .display {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  .price, .mono {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }
  a { color: inherit; }
  header {
    background: var(--pine);
    color: var(--paper);
    padding: 28px 20px 34px;
  }
  header .shop-name {
    font-size: 28px;
    font-weight: 600;
    font-style: italic;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  header .tagline {
    margin: 0;
    font-size: 14px;
    color: rgba(251,249,244,0.75);
    letter-spacing: 0.3px;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 22px 16px 60px;
  }
  #state-msg {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .product-card {
    position: relative;
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(20,32,28,0.10), 0 1px 2px rgba(20,32,28,0.06);
    display: flex;
    flex-direction: column;
    animation: rise 0.35s ease both;
  }
  @media (prefers-reduced-motion: reduce) {
    .product-card { animation: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .product-photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #EFEAE0;
    display: block;
  }
  .product-photo.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--pine);
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-style: italic;
  }
  .stub-divider {
    position: relative;
    margin: 0 0 0;
    border-top: 2px dashed var(--line);
  }
  .stub-divider::before,
  .stub-divider::after {
    content: '';
    position: absolute;
    top: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--paper);
  }
  .stub-divider::before { left: -10px; }
  .stub-divider::after { right: -10px; }
  .product-info {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .product-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
  }
  .product-price {
    font-size: 18px;
    font-weight: 600;
    color: var(--marigold);
    margin: 0;
  }
  .contact-row {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .no-contact {
    margin-top: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .wa-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: var(--pine);
    color: var(--paper);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 999px;
    transition: background 0.15s ease;
    flex: 1 1 auto;
  }
  .wa-btn:hover, .wa-btn:focus-visible { background: var(--pine-dark); }
  .wa-btn:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  .wa-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  footer {
    text-align: center;
    padding: 24px 16px 40px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <p class="shop-name display" id="shop-name-el">My Shop</p>
  <p class="tagline">Tap a product to get in touch</p>
</header>
<main>
  <div id="state-msg">Loading products…</div>
  <div class="grid" id="grid" style="display:none;"></div>
</main>
<footer id="footer-el">My Shop</footer>

<script>
  // ---- Fallback defaults, used only until shop settings load ----
  let SHOP_NAME = "My Shop";
  let DEFAULT_PHONE = "";
  let DEFAULT_TELEGRAM = "";
  let DEFAULT_INSTAGRAM = "";
  // All of the above are editable from the admin page's "Shop settings" —
  // no need to edit this file for those anymore. Price is typed exactly as
  // you want it shown (e.g. "800 Birr") on each product, in the admin form.

  const stateMsg = document.getElementById('state-msg');
  const grid = document.getElementById('grid');

  function phoneIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 2 6a2 2 0 0 1 2-2Z"></path></svg>';
  }
  function telegramIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4Z"></path></svg>';
  }
  function instagramIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"></circle></svg>';
  }

  function buildContactButtons(product) {
    const phone = product.phone || DEFAULT_PHONE;
    const telegram = product.telegram || DEFAULT_TELEGRAM;
    const instagram = product.instagram || DEFAULT_INSTAGRAM;
    const buttons = [];
    if (phone) buttons.push({ label: 'Call', href: 'tel:' + phone, icon: phoneIconSvg() });
    if (telegram) buttons.push({ label: 'Telegram', href: 'https://t.me/' + telegram.replace(/^@/, ''), icon: telegramIconSvg() });
    if (instagram) buttons.push({ label: 'Instagram', href: 'https://instagram.com/' + instagram.replace(/^@/, ''), icon: instagramIconSvg() });
    return buttons;
  }

  function renderProducts(products) {
    grid.innerHTML = '';
    if (!products.length) {
      stateMsg.textContent = 'No products yet — check back soon.';
      stateMsg.style.display = 'block';
      grid.style.display = 'none';
      return;
    }
    stateMsg.style.display = 'none';
    grid.style.display = 'grid';

    products.forEach(function (product) {
      const card = document.createElement('div');
      card.className = 'product-card';

      if (product.image_url) {
        const img = document.createElement('img');
        img.className = 'product-photo';
        img.src = product.image_url;
        img.alt = product.name;
        img.loading = 'lazy';
        card.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'product-photo placeholder';
        ph.textContent = (product.name || '?').charAt(0).toUpperCase();
        card.appendChild(ph);
      }

      const divider = document.createElement('div');
      divider.className = 'stub-divider';
      card.appendChild(divider);

      const info = document.createElement('div');
      info.className = 'product-info';

      const name = document.createElement('p');
      name.className = 'product-name';
      name.textContent = product.name;
      info.appendChild(name);

      const price = document.createElement('p');
      price.className = 'product-price price';
      price.textContent = product.price;
      info.appendChild(price);

      const btnRow = document.createElement('div');
      btnRow.className = 'contact-row';
      const contacts = buildContactButtons(product);
      if (contacts.length) {
        contacts.forEach(function (c) {
          const btn = document.createElement('a');
          btn.className = 'wa-btn';
          btn.href = c.href;
          btn.target = '_blank';
          btn.rel = 'noopener';
          btn.innerHTML = c.icon + '<span>' + c.label + '</span>';
          btnRow.appendChild(btn);
        });
      } else {
        const note = document.createElement('p');
        note.className = 'no-contact';
        note.textContent = 'Contact the shop to order';
        btnRow.appendChild(note);
      }
      info.appendChild(btnRow);

      card.appendChild(info);
      grid.appendChild(card);
    });
  }

  fetch('/api/settings')
    .then(function (res) { return res.ok ? res.json() : {}; })
    .catch(function () { return {}; })
    .then(function (s) {
      SHOP_NAME = s.shop_name || SHOP_NAME;
      DEFAULT_PHONE = s.default_phone || '';
      DEFAULT_TELEGRAM = s.default_telegram || '';
      DEFAULT_INSTAGRAM = s.default_instagram || '';
      document.getElementById('shop-name-el').textContent = SHOP_NAME;
      document.getElementById('footer-el').textContent = SHOP_NAME;
      document.title = SHOP_NAME;
      return fetch('/api/products');
    })
    .then(function (res) { if (!res.ok) throw new Error('Failed to load'); return res.json(); })
    .then(renderProducts)
    .catch(function () {
      stateMsg.textContent = "Couldn't load products right now. Please refresh.";
    });
</script>
</body>
</html>
